<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Narukami Shrine - Sponsors</title>
    <style>
        :root {
            --shrine-red: #b32424;
            --shrine-pink: #fce4ec;
            --shrine-gold: #d4af37;
            --dark-wood: #2c1a1a;
            --text-color: #333333;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #fff9f9;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--shrine-red);
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 5px solid var(--shrine-gold);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            margin: 0.5rem 0 0 0;
            font-style: italic;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .quote-box {
            background-color: var(--shrine-pink);
            border-left: 5px solid var(--shrine-red);
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            border-radius: 4px;
            font-style: italic;
        }

        .quote-box span {
            display: block;
            text-align: right;
            margin-top: 0.5rem;
            font-weight: bold;
            color: var(--shrine-red);
        }

        h2 {
            color: var(--shrine-red);
            border-bottom: 2px solid var(--shrine-pink);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
        }

        .benefactor-list {
            list-style-type: none;
            padding: 0;
        }

            background: #ffffff;
            margin-bottom: 1rem;
            padding: 1rem;
            border
